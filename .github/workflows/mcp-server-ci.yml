name: MCP server checks

"on":
  pull_request:
    paths: ['mcp-server/**', '.github/workflows/mcp-server-ci.yml']
  push:
    branches: [main]
    paths: ['mcp-server/**', '.github/workflows/mcp-server-ci.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mcp-server-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Path-filtered checks need an unconditional gate before being required on every PR.
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    defaults:
      run:
        working-directory: mcp-server
    services:
      redis:
        image: redis:7.4-alpine@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe
        ports: ['6379/tcp']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -c ci-constraints.txt -e '.[dev,redis]'
      - run: scripts/verify.sh
        env:
          MCP_TEST_REDIS_URL: redis://localhost:${{ job.services.redis.ports['6379'] }}/15
      - name: Build wheel and check base install
        run: |
          python -m pip wheel --no-deps -w "$RUNNER_TEMP/mcp-dist" .
          python -m venv "$RUNNER_TEMP/mcp-base"
          "$RUNNER_TEMP/mcp-base/bin/pip" install -c ci-constraints.txt "$RUNNER_TEMP"/mcp-dist/*.whl
          "$RUNNER_TEMP/mcp-base/bin/python" scripts/smoke-wheel.py
          "$RUNNER_TEMP/mcp-base/bin/python" scripts/smoke-startup.py "$RUNNER_TEMP/mcp-base/bin/wazuh-mcp"

  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: docker build --tag wazuh-mcp-ci ./mcp-server
      - run: docker run -i --rm --network none --entrypoint python wazuh-mcp-ci - < mcp-server/scripts/smoke-startup.py
      - run: docker run --rm --network none --entrypoint python wazuh-mcp-ci -m wazuh_mcp.preflight_cli --help
