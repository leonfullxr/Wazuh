name: offline-ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.12.13
          cache: false
      - name: Prepare locked local caches from official registries
        run: |
          python -m pip install --disable-pip-version-check 'uv==0.11.28'
          make bootstrap
      - name: Run offline acceptance
        run: make ci-check
      - name: Upload evidence ledger
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: ai-soc-offline-evidence-${{ github.sha }}
          path: build/evidence/
          if-no-files-found: warn
          retention-days: 30
