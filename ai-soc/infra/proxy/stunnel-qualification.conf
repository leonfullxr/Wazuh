# TLS front end for task runtimes configured with https://proxy-host:443.
# stunnel forwards the decrypted HTTP proxy protocol to Squid on loopback;
# Squid then checks CONNECT authority and the tunneled TLS ClientHello SNI.
foreground = yes
client = no
sslVersionMin = TLSv1.2

[qualification-https-proxy]
accept = 0.0.0.0:443
connect = 127.0.0.1:3128
cert = /etc/stunnel/proxy.pem
key = /etc/stunnel/proxy.key
