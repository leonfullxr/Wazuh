# Reference Squid configuration for an in-VPC HTTPS CONNECT forward proxy.
# Install the FQDN-only ACL file generated from
# `terraform output -json qualification_proxy_required_hosts` at this path.
# Use a TLS inspection CA certificate trusted by the ECS task runtime.
# SslBump peeks only at ClientHello SNI and splices allowed TLS unchanged.
http_port 127.0.0.1:3128 ssl-bump cert=/etc/squid/proxy.pem key=/etc/squid/proxy.key generate-host-certificates=off

acl CONNECT method CONNECT
acl SSL_ports port 443
acl CONNECT_ipv4 url_regex -i ^([0-9]{1,3}\.){3}[0-9]{1,3}:443$
acl CONNECT_ipv6 url_regex -i ^\[[0-9a-f:.]+\]:443$
acl qualification_hosts dstdomain "/etc/squid/qualification-allowed-hosts.txt"
acl SslBump1 at_step SslBump1
acl SslBump2 at_step SslBump2
external_acl_type connect_sni_match ttl=0 negative_ttl=0 cache=0 children-max=1 %URI %ssl::>sni /etc/squid/connect-sni-match.sh
acl matching_connect_sni external connect_sni_match "/etc/squid/qualification-allowed-hosts.txt"

http_access deny !CONNECT
http_access deny CONNECT !SSL_ports
http_access deny CONNECT CONNECT_ipv4
http_access deny CONNECT CONNECT_ipv6
http_access deny CONNECT !qualification_hosts
http_access allow CONNECT qualification_hosts
http_access deny all

ssl_bump peek SslBump1
ssl_bump splice matching_connect_sni SslBump2
ssl_bump terminate all

# No parent is required: Squid forwards allowed CONNECT tunnels directly to
# their resolved origin. Do not add never_direct without a configured parent.
