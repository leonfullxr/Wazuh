[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "ai-soc"
version = "0.1.0"
description = "Typed, read-only AI SOC service contracts"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
  "boto3==1.43.108",
  "cryptography==46.0.3",
  "fastapi==0.142.2",
  "httpx==0.28.1",
  "mcp==1.30.0",
  "opentelemetry-api==1.45.0",
  "opentelemetry-sdk==1.45.0",
  "opentelemetry-exporter-otlp-proto-grpc==1.45.0",
  "PyJWT[crypto]==2.10.1",
  "pydantic==2.13.5",
  "pydantic-settings==2.13.1",
  "PyYAML==6.0.3",
  "typing-extensions==4.15.0",
  "tzdata==2025.3",
  "uvicorn==0.41.0",
]

[project.scripts]
ai-soc-content = "ai_soc.content.cli:main"

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.3.0",
  "pyright==1.1.408",
  "ruff==0.15.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ai_soc"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["src/ai_soc"]
reportMissingTypeStubs = false

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["build/**"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
