# analysisd thread pool sizes.
#
# Default 0 makes analysisd size pools from visible CPUs. In a container that is
# the node CPU count, not the cgroup quota. A tight limit on a large node then
# spawns thousands of threads, starves wazuh-db, and shows Error 2013 / 2017
# with agents active on the worker but disconnected on the master. Throttle
# counters stay at zero; count threads instead.
#
# About half the vCPU limit is a sane start. On a 2 vCPU limit, 1 works; 2 adds
# headroom without approaching the failure mode.
# See ../agent-info-sync-failures.md
analysisd.event_threads=2
analysisd.syscheck_threads=2
analysisd.syscollector_threads=2
analysisd.rootcheck_threads=2
analysisd.sca_threads=2
analysisd.hostinfo_threads=2
analysisd.winevt_threads=2
analysisd.rule_matching_threads=2
analysisd.dbsync_threads=2
