# Dashboard ALB only. Ports 1514/1515 never use this Ingress.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wazuh-dashboard
  namespace: wazuh
  annotations:
    alb.ingress.kubernetes.io/scheme: internal
    alb.ingress.kubernetes.io/target-type: ip
    # Pod listens with TLS on 5601; the ALB must use HTTPS to the target.
    alb.ingress.kubernetes.io/backend-protocol: HTTPS
    alb.ingress.kubernetes.io/healthcheck-protocol: HTTPS
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    # Set your ACM certificate ARN for the host below.
    # alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:REGION:ACCOUNT:certificate/ID
    #
    # The pod cert is Wazuh-CA self-signed; the ALB does not verify it. Client
    # TLS terminates on ACM, then the ALB re-encrypts to the pod.
    alb.ingress.kubernetes.io/success-codes: "200,302,401"
spec:
  ingressClassName: alb
  rules:
    - host: wazuh.internal.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dashboard
                port:
                  number: 443
