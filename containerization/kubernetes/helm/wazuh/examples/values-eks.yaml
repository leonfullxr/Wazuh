# Amazon EKS.
#
# Assumes the EBS CSI driver is present and the node role has
# AmazonEC2ContainerRegistryReadOnly if images are mirrored into ECR.
# Create the StorageClass yourself; the chart does not manage one:
#
#   apiVersion: storage.k8s.io/v1
#   kind: StorageClass
#   metadata:
#     name: wazuh-gp3
#   provisioner: ebs.csi.aws.com
#   parameters:
#     type: gp3
#     encrypted: "true"
#   volumeBindingMode: WaitForFirstConsumer   # zonal disk lands in the pod's zone
#   reclaimPolicy: Retain
#   allowVolumeExpansion: true

global:
  storageClass: wazuh-gp3

indexer:
  replicas: 3
  heapSize: 4g
  resources:
    requests: { cpu: "2", memory: 8Gi }
    limits: { cpu: "4", memory: 8Gi }
  persistence:
    size: 500Gi
  # Spread indexer pods across zones. Pinning makes one AZ the failure domain
  # for the whole cluster; spreading keeps each replica with its zonal volume
  # in a different zone.
  topologySpreadConstraints:
 - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: wazuh
          app.kubernetes.io/component: indexer

manager:
  worker:
    replicas: 2
    resources:
      requests: { cpu: "1", memory: 2Gi }
      limits: { cpu: "2", memory: 4Gi }
    persistence:
      size: 100Gi
  master:
    resources:
      requests: { cpu: "1", memory: 2Gi }
      limits: { cpu: "2", memory: 4Gi }
    persistence:
      size: 100Gi
  analysisdThreads: 4

# Agent traffic is raw TCP -> NLB, never ALB or Ingress.
service:
  master:
    type: LoadBalancer
    annotations:
      service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
      service.beta.kubernetes.io/aws-load-balancer-backend-protocol: "tcp"
      # "true" = internal. Older spelling used 0.0.0.0/0 for internet-facing - 
      # a common accidental exposure.
      service.beta.kubernetes.io/aws-load-balancer-internal: "true"
  events:
    type: LoadBalancer
    annotations:
      service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
      service.beta.kubernetes.io/aws-load-balancer-backend-protocol: "tcp"
      service.beta.kubernetes.io/aws-load-balancer-internal: "true"

dashboard:
  ingress:
    enabled: true
    className: alb
    annotations:
      alb.ingress.kubernetes.io/scheme: internal
      alb.ingress.kubernetes.io/target-type: ip
      alb.ingress.kubernetes.io/backend-protocol: HTTPS
      alb.ingress.kubernetes.io/healthcheck-protocol: HTTPS
      alb.ingress.kubernetes.io/ssl-redirect: "443"
      # Wazuh API returns 401 on an unauthenticated health check (correct).
      # Without this the AWS LB Controller readiness gate never opens.
      alb.ingress.kubernetes.io/success-codes: "401"
    hosts:
 - host: wazuh.internal.example.com
        paths:
 - path: /
            pathType: Prefix

# Put the external hostname and any LB FQDN agents resolve into the SAN.
# Hostname verification checks the SAN, never the CN.
certs:
  extraDnsNames:
 - wazuh.internal.example.com

podDisruptionBudget:
  enabled: true
