apiVersion: v2
name: wazuh
description: Wazuh manager cluster, indexer and dashboard on Kubernetes, with an optional agent DaemonSet
type: application

# Chart version — bump whenever the chart itself changes.
version: 0.1.0

# Wazuh release these templates target. Image tags default to this. 4.14.7 is
# the current stable line; 5.x reshapes the upstream deployment and is not
# supported yet.
appVersion: "4.14.7"

kubeVersion: ">=1.23.0-0"

keywords:
  - wazuh
  - siem
  - xdr
  - security
  - opensearch

home: https://documentation.wazuh.com/
sources:
  - https://github.com/wazuh/wazuh-kubernetes
  - https://github.com/wazuh/wazuh-docker

maintainers:
  - name: leonfullxr

annotations:
  artifacthub.io/category: security
  artifacthub.io/license: GPL-2.0-only
  artifacthub.io/links: |
    - name: Wazuh documentation
      url: https://documentation.wazuh.com/
    - name: Kubernetes guides in this knowledge base
      url: https://github.com/leonfullxr/Wazuh/tree/main/containerization/kubernetes
  artifacthub.io/containsSecurityUpdates: "false"
