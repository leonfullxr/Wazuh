{{- if and .Values.manager.enabled .Values.manager.logRetention.enabled }}
{{/*
Manager never prunes alerts/archives itself and the path is fixed, so the
volume fills. Archives grow much faster than alerts — separate retention days.
Prunes the master only; add another CronJob for workers if needed.
*/}}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "wazuh.fullname" . }}-log-retention
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "wazuh.component.labels" (dict "context" . "component" "manager") | nindent 4 }}
spec:
  schedule: {{ .Values.manager.logRetention.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            # Not manager component labels — those would join the events Service and steal agent traffic.
            {{- include "wazuh.selectorLabels" . | nindent 12 }}
            app.kubernetes.io/component: log-retention
        spec:
          restartPolicy: OnFailure
          serviceAccountName: {{ include "wazuh.component.serviceAccountName" (dict "context" . "component" "manager") }}
          {{- include "wazuh.imagePullSecrets" . | nindent 10 }}
          {{- with .Values.manager.podSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          containers:
            - name: prune
              image: {{ include "wazuh.image" (dict "context" . "image" .Values.manager.image) }}
              imagePullPolicy: {{ .Values.manager.image.pullPolicy }}
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  find /var/ossec/logs/alerts/ -type f -mtime +{{ .Values.manager.logRetention.alertsRetentionDays }} -delete
                  find /var/ossec/logs/archives/ -type f -mtime +{{ .Values.manager.logRetention.archivesRetentionDays }} -delete
                  find /var/ossec/logs/alerts/ /var/ossec/logs/archives/ -type d -empty -delete
              volumeMounts:
                - name: data
                  mountPath: /var/ossec/logs
                  subPath: wazuh/var/ossec/logs
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: data-{{ include "wazuh.manager.master.fullname" . }}-0
{{- end }}
