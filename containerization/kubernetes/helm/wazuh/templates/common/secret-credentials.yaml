{{- if not .Values.credentials.existingSecret }}
{{- include "wazuh.creds" . }}
{{- $c := .Values._wazuhCreds }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "wazuh.credentialsSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "wazuh.labels" . | nindent 4 }}
    {{- with .Values.commonLabels }}{{- toYaml . | nindent 4 }}{{- end }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
data:
  indexer-username: {{ index $c "indexer-username" | b64enc | quote }}
  indexer-password: {{ index $c "indexer-password" | b64enc | quote }}
  dashboard-username: {{ index $c "dashboard-username" | b64enc | quote }}
  dashboard-password: {{ index $c "dashboard-password" | b64enc | quote }}
  api-username: {{ index $c "api-username" | b64enc | quote }}
  api-password: {{ index $c "api-password" | b64enc | quote }}
  # Mounted as /wazuh-config-mount/etc/authd.pass, so the key name is the file name.
  # Enrollment password is never passed on a command line.
  authd.pass: {{ index $c "authd.pass" | b64enc | quote }}
  cluster-key: {{ index $c "cluster-key" | b64enc | quote }}
{{- end }}
