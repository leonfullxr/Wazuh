{{- if .Values.indexer.enabled }}
{{- include "wazuh.creds" . }}
{{- $c := .Values._wazuhCreds }}
{{/*
Secret (not ConfigMap) because it holds password hashes. Only the two users
this stack needs. The stock OpenSearch demo set ships published bcrypt hashes
(effectively public credentials).
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "wazuh.fullname" . }}-indexer-securityconfig
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "wazuh.component.labels" (dict "context" . "component" "indexer") | nindent 4 }}
    {{- with .Values.commonLabels }}{{- toYaml . | nindent 4 }}{{- end }}
type: Opaque
stringData:
  internal_users.yml: |
    ---
    _meta:
      type: "internalusers"
      config_version: 2

    {{ index $c "indexer-username" }}:
      hash: {{ include "wazuh.bcrypt" (index $c "indexer-password") | quote }}
      reserved: true
      backend_roles:
        - "admin"
      description: "Wazuh indexer admin user"

    {{ index $c "dashboard-username" }}:
      hash: {{ include "wazuh.bcrypt" (index $c "dashboard-password") | quote }}
      reserved: true
      description: "Dashboard service account used to talk to the indexer"
{{- end }}
